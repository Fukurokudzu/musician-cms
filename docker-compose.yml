services:
  web:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-${UID:-1000}}
    volumes:
      - ./log:/rails/log
      - storage_data:/rails/storage
      - music_library:/rails/app/music
      - credentials_data:/rails/config/credentials
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - REDIS_URL=redis://redis-db:6379
      - DATABASE_URL=postgres://root:password@postgres-db:5432/musician_cms_production
      - RAILS_ENV=production
      - RAILS_SERVE_STATIC_FILES=true
      - RAILS_ASSETS_COMPILE=true
      - RAILS_LOG_TO_STDOUT=true
    depends_on:
      redis-db:
        condition: service_started
      postgres-db:
        condition: service_healthy

  postgres-db:
    image: postgres:16
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: musician_cms_production
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d musician_cms_production"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis-db:
    image: redis:7

  sidekiq:
    build: .
    command: bundle exec sidekiq
    volumes:
      - ./log:/rails/log
      - storage_data:/rails/storage
      - music_library:/rails/app/music
      - credentials_data:/rails/config/credentials
    environment:
      - REDIS_URL=redis://redis-db:6379
      - DATABASE_URL=postgres://root:password@postgres-db:5432/musician_cms_production
      - RAILS_ENV=production
      - RAILS_LOG_TO_STDOUT=true
    depends_on:
      redis-db:
        condition: service_started
      postgres-db:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  music_library:
  storage_data:
  credentials_data:
